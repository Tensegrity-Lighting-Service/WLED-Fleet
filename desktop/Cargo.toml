[package]
name = "wled-fleet-desktop"
version = "0.3.0"
description = "Fenêtre native WLED Fleet (Tauri / WebView2) : lance node server.js caché et affiche la page"
edition = "2021"
rust-version = "1.77.2"

# Même recette que Lumitrack (frontend/src-tauri) : coquille Tauri 2, moteur
# en sidecar. Ici le sidecar est `node server.js` du dossier parent, lancé
# sans console (CREATE_NO_WINDOW) et relancé sur le code 75 (bouton
# « Redémarrer le serveur » de la page). Aucune IPC : la fenêtre charge
# simplement http://127.0.0.1:8792/.

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
# Mise à jour portable (2026-09) : pas d'installeur (NSIS/MSI) — le plugin sert
# seulement à vérifier/télécharger l'archive signée depuis les GitHub Releases ;
# install_update (main.rs) l'extrait et remplace les fichiers sur place.
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
